<!DOCTYPE html>
<html lang="zh-CN"><head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>霜信</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#f6f8fb" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0f1216" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="霜信">
  <link rel="apple-touch-icon" href="/icons/icon-180.png">
  <link rel="icon" type="image/png" href="/icons/icon-192.png">
  <script>
    (function(){ try { var t = localStorage.getItem('frostline_theme') || 'system'; if (t !== 'system') document.documentElement.dataset.theme = t; } catch(e){} })();
  </script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,wght@1,500&display=swap&text=Frostline" rel="stylesheet">
<style>
    :root {
      --bg: #f6f8fb;
      --panel: #ffffff;
      --panel2: #f1f4f8;
      --hover: #eef2f7;
      --line: #e3e8ef;
      --text: #1b2330;
      --text2: #5b6676;
      --text3: #97a1b0;
      --accent: #3d7eff;
      --accent-soft: #e8f0ff;
      --accent-text: #ffffff;
      --bubble-self: #3d7eff;
      --bubble-self-text: #ffffff;
      --bubble-other: #ffffff;
      --bubble-other-text: #1b2330;
      --danger: #e5484d;
      --danger-soft: #fdecec;
      --shadow: 0 1px 2px rgba(20,30,50,.06), 0 4px 16px rgba(20,30,50,.06);
      --shadow-lg: 0 12px 40px rgba(20,30,50,.18);
      --code-bg: rgba(20,30,50,.07);
      --radius: 18px;
      --font: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Segoe UI", sans-serif;
      --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      --sidebar-w: 320px;
      --safe-b: env(safe-area-inset-bottom, 0px);
      --safe-t: env(safe-area-inset-top, 0px);
      color-scheme: light;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg: #0f1216; --panel: #171b21; --panel2: #1e232b; --hover: #232932; --line: #2a313b;
        --text: #e8ecf2; --text2: #a3adbb; --text3: #6b7584;
        --accent: #5b92ff; --accent-soft: rgba(91,146,255,.16);
        --bubble-self: #3a6fe0; --bubble-other: #222831; --bubble-other-text: #e8ecf2;
        --danger: #ff6369; --danger-soft: rgba(255,99,105,.14);
        --shadow: 0 1px 2px rgba(0,0,0,.3); --shadow-lg: 0 12px 40px rgba(0,0,0,.5);
        --code-bg: rgba(255,255,255,.1); color-scheme: dark;
      }
    }
    :root[data-theme="dark"] {
      --bg: #0f1216; --panel: #171b21; --panel2: #1e232b; --hover: #232932; --line: #2a313b;
      --text: #e8ecf2; --text2: #a3adbb; --text3: #6b7584;
      --accent: #5b92ff; --accent-soft: rgba(91,146,255,.16);
      --bubble-self: #3a6fe0; --bubble-other: #222831; --bubble-other-text: #e8ecf2;
      --danger: #ff6369; --danger-soft: rgba(255,99,105,.14);
      --shadow: 0 1px 2px rgba(0,0,0,.3); --shadow-lg: 0 12px 40px rgba(0,0,0,.5);
      --code-bg: rgba(255,255,255,.1); color-scheme: dark;
    }

    [hidden] { display: none !important; }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; overflow: hidden; overscroll-behavior: none; }
    html { background: var(--panel); }
    body { font-family: var(--font); background: var(--bg); color: var(--text); height: 100dvh; overflow: hidden; -webkit-font-smoothing: antialiased; font-size: 15px; -webkit-tap-highlight-color: transparent; }
    button { font: inherit; color: inherit; background: none; border: none; cursor: pointer; }
    input, textarea { font: inherit; color: inherit; }
    svg { width: 20px; height: 20px; flex-shrink: 0; }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-thumb { background: var(--line); border-radius: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }

    #app { display: flex; position: fixed; inset: 0; height: auto; overflow: hidden; }

    /* ── sidebar ── */
    #sidebar { width: var(--sidebar-w); flex-shrink: 0; background: var(--panel); border-right: 1px solid var(--line); display: flex; flex-direction: column; padding-top: var(--safe-t); }
    .side-top { display: flex; align-items: center; gap: 10px; padding: 16px 16px 10px; }
    .brand { font-weight: 700; font-size: 20px; letter-spacing: -.02em; flex: 1; display: flex; align-items: center; gap: 8px; }
    .brand-mark { width: 26px; height: 26px; border-radius: 8px; background: linear-gradient(135deg, #7fb2ff, #3d7eff); display: grid; place-items: center; color: #fff; }
    .brand-mark svg { width: 16px; height: 16px; }
    .icon-btn { width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center; color: var(--text2); transition: background .15s, color .15s; }
    .icon-btn:hover { background: var(--hover); color: var(--text); }
    .icon-btn.danger:hover { background: var(--danger-soft); color: var(--danger); }
    .seg { display: flex; margin: 0 16px 8px; background: var(--panel2); border-radius: 12px; padding: 3px; }
    .seg button { flex: 1; padding: 7px 0; border-radius: 9px; font-size: 14px; color: var(--text2); transition: all .15s; }
    .seg button.active { background: var(--panel); color: var(--text); font-weight: 600; box-shadow: var(--shadow); }
    #conv-list { flex: 1; overflow-y: auto; padding: 4px 8px; }
    .conv-item { display: flex; align-items: center; gap: 12px; padding: 10px; border-radius: 14px; cursor: pointer; transition: background .12s; }
    .conv-item:hover { background: var(--hover); }
    .conv-item.active { background: var(--accent-soft); }
    .conv-info { flex: 1; min-width: 0; }
    .conv-line { display: flex; align-items: baseline; gap: 8px; }
    .conv-name { flex: 1; font-weight: 600; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .conv-time { font-size: 12px; color: var(--text3); flex-shrink: 0; }
    .conv-preview { font-size: 13px; color: var(--text2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px; flex: 1; }
    .unread-badge { min-width: 20px; height: 20px; padding: 0 6px; border-radius: 10px; background: var(--danger); color: #fff; font-size: 12px; font-weight: 600; display: grid; place-items: center; flex-shrink: 0; }
    .list-empty { padding: 40px 12px; text-align: center; font-size: 13px; color: var(--text3); }
    .side-actions { display: flex; gap: 8px; padding: 10px 16px calc(12px + var(--safe-b)); border-top: 1px solid var(--line); }
    .side-actions .btn { flex: 1; }

    .me-row { display: flex; align-items: center; gap: 10px; padding: 8px 16px 12px; }
    .me-row .me-name { flex: 1; font-size: 14px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; cursor: pointer; }

    /* ── avatars ── */
    .avatar { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; color: #fff; font-weight: 600; font-size: 15px; flex-shrink: 0; overflow: hidden; background-size: cover; background-position: center; user-select: none; }
    .avatar.sm { width: 32px; height: 32px; font-size: 12px; }
    .avatar.xs { width: 26px; height: 26px; font-size: 11px; }
    .avatar.lg { width: 84px; height: 84px; font-size: 28px; }
    .avatar.group { border-radius: 14px; }
    .avatar img { width: 100%; height: 100%; object-fit: cover; }

    /* ── main ── */
    #main { flex: 1; display: flex; flex-direction: column; min-width: 0; position: relative; background: var(--bg); }
    #chat-header { flex-shrink: 0; display: flex; align-items: center; gap: 6px; padding: calc(8px + var(--safe-t)) 12px 8px; min-height: 60px; background: var(--panel); border-bottom: 1px solid var(--line); }
    #back-btn { display: none; }
    .chat-head-info { flex: 1; min-width: 0; padding-left: 6px; display: flex; flex-direction: column; justify-content: center; }
    #chat-title { font-weight: 600; font-size: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    #chat-subtitle { font-size: 12px; color: var(--text3); }
    #chat-subtitle:empty { display: none; }
    #chat-subtitle.clickable { cursor: pointer; }
    #chat-subtitle.clickable:hover { color: var(--accent); }
    #chat-subtitle.typing { color: var(--accent); }
    .head-actions { display: flex; gap: 2px; }

    #messages-area { flex: 1; min-height: 0; overflow-y: auto; padding: 16px 16px 8px; overscroll-behavior: contain; }
    .empty-state { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; color: var(--text3); font-size: 14px; }
    .empty-state .brand-mark { width: 56px; height: 56px; border-radius: 18px; }
    .empty-state .brand-mark svg { width: 30px; height: 30px; }
    .date-divider { text-align: center; margin: 14px 0 10px; }
    .date-divider span { font-size: 12px; color: var(--text3); background: var(--panel2); padding: 3px 10px; border-radius: 10px; }

    .msg { display: flex; gap: 8px; margin: 0 0 4px; align-items: flex-end; position: relative; }
    .msg.self { flex-direction: row-reverse; }
    .msg .avatar { margin-bottom: 18px; }
    .msg.cont .avatar { visibility: hidden; height: 0; margin-bottom: 0; }
    .msg-col { display: flex; flex-direction: column; max-width: min(72%, 560px); min-width: 0; }
    .msg.self .msg-col { align-items: flex-end; }
    .msg-sender { font-size: 12px; color: var(--text3); margin: 6px 0 3px 4px; }
    .bubble { min-width: 0; max-width: 100%; padding: 9px 13px; border-radius: var(--radius); background: var(--bubble-other); color: var(--bubble-other-text); box-shadow: var(--shadow); line-height: 1.55; word-break: break-word; overflow-wrap: anywhere; user-select: text; -webkit-user-select: text; }
    .msg.self .bubble { background: var(--bubble-self); color: var(--bubble-self-text); border-bottom-right-radius: 6px; }
    .msg.other .bubble { border-bottom-left-radius: 6px; }
    .bubble.media-only, .msg.self .bubble.media-only { padding: 0; background: transparent !important; box-shadow: none; }
    .msg-meta { font-size: 11px; color: var(--text3); margin: 3px 6px 8px; display: flex; gap: 6px; align-items: center; }
    .msg.flash .bubble { animation: flash 1.4s ease; }
    @keyframes flash { 0%,60% { box-shadow: 0 0 0 3px var(--accent); } 100% { box-shadow: var(--shadow); } }
    .msg.failed .bubble { opacity: .6; }
    .fail-tag { color: var(--danger); cursor: pointer; font-weight: 600; }
    .sending-tag { color: var(--text3); }

    .md p + p { margin-top: 6px; }
    .md strong { font-weight: 700; }
    .md code { font-family: var(--mono); font-size: .88em; background: var(--code-bg); padding: 1px 5px; border-radius: 5px; }
    .md pre { font-family: var(--mono); font-size: 13px; background: var(--code-bg); padding: 8px 10px; border-radius: 10px; overflow-x: auto; margin: 4px 0; white-space: pre; }
    .md pre code { background: none; padding: 0; }
    .md a { color: inherit; text-decoration: underline; text-underline-offset: 2px; }
    .md blockquote { border-left: 3px solid currentColor; opacity: .8; padding-left: 8px; margin: 2px 0; }
    .md ul, .md ol { padding-left: 20px; }
    .mention { font-weight: 600; }
    .msg.other .mention { color: var(--accent); }

    .quote { display: block; overflow: hidden; min-width: 0; font-size: 13px; padding: 5px 9px; margin-bottom: 6px; border-radius: 10px; border-left: 3px solid currentColor; background: rgba(127,127,127,.14); cursor: pointer; max-width: 100%; }
    .quote .q-name { font-weight: 600; font-size: 12px; opacity: .85; }
    .quote .q-text { opacity: .85; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    .img-attach { display: block; max-width: min(260px, 100%); max-height: 320px; border-radius: 14px; cursor: zoom-in; object-fit: cover; }
    video.img-attach { background: var(--panel2); }
    video.img-attach { cursor: default; }
    .file-card { display: flex; align-items: center; gap: 10px; padding: 6px 2px; min-width: 200px; cursor: pointer; }
    .file-card .f-icon { width: 38px; height: 38px; border-radius: 10px; background: rgba(127,127,127,.16); display: grid; place-items: center; }
    .file-card .f-name { font-size: 14px; font-weight: 500; word-break: break-all; }
    .file-card .f-size { font-size: 12px; opacity: .7; }
    .file-actions { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 4px; }
    .chip-btn { font-size: 12px; padding: 4px 10px; border-radius: 999px; background: rgba(127,127,127,.16); }
    .chip-btn:hover { background: rgba(127,127,127,.26); }
    .attach + .attach, .md + .attach, .attach + .md { margin-top: 6px; }

    .msg-more { position: absolute; top: 50%; transform: translateY(-50%); opacity: 0; width: 28px; height: 28px; border-radius: 8px; display: grid; place-items: center; color: var(--text3); }
    .msg-more svg { width: 16px; height: 16px; }
    .msg.other .msg-more { right: auto; }
    @media (hover: hover) { .msg:hover .msg-more { opacity: 1; } .msg-more:hover { background: var(--hover); color: var(--text); } }
    .msg-row-wrap { display: flex; align-items: center; gap: 4px; min-width: 0; max-width: 100%; }
    .msg.self .msg-row-wrap { flex-direction: row-reverse; }
    .msg-row-wrap .msg-more { position: static; transform: none; }

    #ctx-menu { position: fixed; z-index: 300; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow-lg); padding: 5px; min-width: 140px; display: none; }
    #ctx-menu.open { display: block; animation: pop .12s ease; }
    #ctx-menu button { display: flex; align-items: center; gap: 10px; width: 100%; padding: 9px 12px; border-radius: 9px; font-size: 14px; text-align: left; }
    #ctx-menu button svg { width: 17px; height: 17px; color: var(--text2); }
    #ctx-menu button:hover { background: var(--hover); }
    #ctx-menu button.danger { color: var(--danger); }
    #ctx-menu button.danger svg { color: var(--danger); }
    @keyframes pop { from { transform: scale(.96); opacity: 0; } to { transform: none; opacity: 1; } }

    /* ── composer ── */
    #composer { flex-shrink: 0; background: var(--panel); border-top: 1px solid var(--line); padding: 8px 12px calc(8px + var(--safe-b)); position: relative; }
    #reply-bar { display: none; align-items: center; gap: 8px; padding: 6px 10px; margin-bottom: 6px; border-left: 3px solid var(--accent); background: var(--accent-soft); border-radius: 10px; font-size: 13px; }
    #reply-bar.open { display: flex; }
    #reply-bar .rb-text { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--text2); }
    #reply-bar .rb-text b { color: var(--accent); font-weight: 600; }
    #file-previews { display: flex; gap: 6px; flex-wrap: wrap; }
    #file-previews:not(:empty) { margin-bottom: 6px; }
    .fp-chip { display: flex; align-items: center; gap: 6px; padding: 5px 6px 5px 10px; border-radius: 10px; background: var(--panel2); font-size: 12px; max-width: 220px; }
    .fp-chip .fp-name { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .fp-chip button { width: 20px; height: 20px; border-radius: 6px; display: grid; place-items: center; color: var(--text3); }
    .fp-chip button:hover { background: var(--hover); color: var(--danger); }
    .composer-row { display: flex; align-items: flex-end; gap: 6px; }
    #msg-input { flex: 1; resize: none; border: 1px solid var(--line); background: var(--panel2); border-radius: 20px; padding: 9px 14px; outline: none; max-height: 140px; line-height: 1.45; font-size: 15px; transition: border-color .15s; }
    #msg-input:focus { border-color: var(--accent); background: var(--panel); }
    #send-btn { width: 40px; height: 40px; border-radius: 50%; background: var(--accent); color: #fff; display: grid; place-items: center; transition: transform .1s, opacity .15s; }
    #send-btn:active { transform: scale(.94); }
    #send-btn:disabled { opacity: .5; }
    #send-btn svg { width: 18px; height: 18px; }
    #mention-popup { position: absolute; bottom: 100%; left: 12px; right: 12px; max-width: 320px; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow-lg); padding: 5px; display: none; max-height: 240px; overflow-y: auto; }
    #mention-popup.open { display: block; }
    .pick-item { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 10px; cursor: pointer; font-size: 14px; }
    .pick-item:hover, .pick-item.sel { background: var(--hover); }
    .pick-item .pi-name { flex: 1; }
    .pick-item .pi-tag { font-size: 12px; color: var(--text3); }
    .pick-item .pi-tag.go { color: var(--accent); }

    #drop-overlay { position: absolute; inset: 0; background: color-mix(in srgb, var(--accent) 12%, transparent); border: 2px dashed var(--accent); border-radius: 16px; margin: 8px; display: none; align-items: center; justify-content: center; font-size: 15px; color: var(--accent); font-weight: 600; z-index: 20; pointer-events: none; }
    #drop-overlay.show { display: flex; }

    /* ── search panel ── */
    #search-panel { position: absolute; inset: 0; background: var(--bg); z-index: 30; display: none; flex-direction: column; }
    #search-panel.open { display: flex; }
    .search-head { display: flex; align-items: center; gap: 8px; padding: calc(10px + var(--safe-t)) 12px 10px; background: var(--panel); border-bottom: 1px solid var(--line); }
    .search-box { flex: 1; display: flex; align-items: center; gap: 8px; background: var(--panel2); border-radius: 12px; padding: 0 12px; }
    .search-box svg { width: 17px; height: 17px; color: var(--text3); }
    .search-box input { flex: 1; border: none; background: none; outline: none; padding: 10px 0; font-size: 15px; }
    #search-results { flex: 1; overflow-y: auto; padding: 8px; }
    .search-hint { text-align: center; color: var(--text3); font-size: 13px; padding: 40px 12px; }
    .sr-item { display: flex; gap: 10px; padding: 10px; border-radius: 12px; cursor: pointer; }
    .sr-item:hover { background: var(--hover); }
    .sr-body { flex: 1; min-width: 0; }
    .sr-top { display: flex; gap: 8px; align-items: baseline; }
    .sr-name { font-weight: 600; font-size: 14px; flex: 1; }
    .sr-time { font-size: 12px; color: var(--text3); flex-shrink: 0; }
    .sr-text { font-size: 14px; color: var(--text2); margin-top: 2px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; word-break: break-word; }
    .sr-text mark { background: color-mix(in srgb, var(--accent) 25%, transparent); color: var(--text); border-radius: 3px; padding: 0 1px; }

    /* ── buttons / fields / modals ── */
    .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 9px 16px; border-radius: 12px; font-size: 14px; font-weight: 500; transition: background .15s, opacity .15s; white-space: nowrap; }
    .btn svg { width: 17px; height: 17px; }
    .btn-primary { background: var(--accent); color: #fff; }
    .btn-primary:hover { opacity: .92; }
    .btn-ghost { background: var(--panel2); color: var(--text); }
    .btn-ghost:hover { background: var(--hover); }
    .btn-danger { background: var(--danger); color: #fff; }
    .btn:disabled { opacity: .5; cursor: default; }
    .field { width: 100%; border: 1px solid var(--line); background: var(--panel2); border-radius: 12px; padding: 10px 13px; outline: none; font-size: 15px; transition: border-color .15s; }
    .field:focus { border-color: var(--accent); background: var(--panel); }
    .error-msg { color: var(--danger); font-size: 13px; min-height: 18px; }
    .modal-bg { position: fixed; inset: 0; background: rgba(10,15,25,.42); z-index: 200; display: none; align-items: center; justify-content: center; padding: 16px; backdrop-filter: blur(2px); }
    .modal-bg.open { display: flex; }
    #crop-modal { z-index: 210; }
    .crop-stage { position: relative; width: 100%; aspect-ratio: 1; max-width: 320px; margin: 0 auto; border-radius: 16px; overflow: hidden; background: #111; touch-action: none; cursor: grab; }
    .crop-stage canvas { width: 100%; height: 100%; display: block; }
    .crop-zoom { width: 100%; accent-color: var(--accent); }
    .modal { background: var(--panel); border-radius: 22px; box-shadow: var(--shadow-lg); width: 100%; max-width: 400px; padding: 22px; display: flex; flex-direction: column; gap: 12px; max-height: 88dvh; overflow-y: auto; animation: pop .15s ease; }
    .modal h2 { font-size: 18px; font-weight: 600; }
    .modal p { font-size: 14px; color: var(--text2); line-height: 1.6; }
    .modal-head { display: flex; align-items: center; justify-content: space-between; }
    .btn-row { display: flex; gap: 8px; justify-content: flex-end; }
    .pick-list { max-height: 240px; overflow-y: auto; margin: 0 -6px; }
    .pick-list:empty { display: none; }
    .member-chips { display: flex; flex-wrap: wrap; gap: 6px; }
    .member-chips:empty { display: none; }
    .member-chip { display: flex; align-items: center; gap: 4px; padding: 4px 6px 4px 10px; background: var(--accent-soft); color: var(--accent); border-radius: 999px; font-size: 13px; }
    .member-chip button { width: 18px; height: 18px; border-radius: 50%; display: grid; place-items: center; font-size: 11px; }
    .member-row { display: flex; align-items: center; gap: 10px; padding: 8px 6px; }
    .member-row .m-name { flex: 1; font-size: 14px; }
    .owner-tag { font-size: 11px; color: var(--accent); background: var(--accent-soft); padding: 2px 8px; border-radius: 999px; }
    .member-remove { font-size: 12px; color: var(--danger); padding: 4px 10px; border-radius: 8px; }
    .member-remove:hover { background: var(--danger-soft); }

    html.auth, html.auth body { background: #1f273f !important; }
    /* 浏览器里底部工具栏会缩放，场景铺满大视口，避免露出底色 */
    @media (display-mode: browser) { .auth-bg { bottom: auto !important; height: 100lvh !important; } }
    .auth-bg { background: #0b1533 !important; backdrop-filter: none !important; overflow: hidden; align-items: stretch !important; padding: 0 20px !important; }
    .auth-scene { position: absolute; inset: 0; width: 100%; height: 100%; }
    .auth-bg::after { content: ""; position: absolute; inset: -50% 0 0; pointer-events: none; background-image: radial-gradient(2.5px 2.5px at 20px 30px, #fff, transparent), radial-gradient(2px 2px at 90px 120px, rgba(255,255,255,.85), transparent), radial-gradient(3px 3px at 160px 60px, rgba(255,255,255,.9), transparent), radial-gradient(2px 2px at 230px 170px, rgba(255,255,255,.75), transparent); background-size: 260px 200px; opacity: .7; animation: snowfall 20s linear infinite; }
    @keyframes snowfall { to { transform: translateY(50%); } }
    @media (prefers-reduced-motion: reduce) { .auth-bg::after { animation: none; } }
    .auth-bg::before { content: ""; position: absolute; inset: 0; z-index: 1; pointer-events: none; background: linear-gradient(to bottom, transparent 36%, rgba(9,17,42,.55) 56%, rgba(9,17,42,.9) 100%); }
    .auth-bg .auth-scene { z-index: 0; }
    .auth-card { position: relative; z-index: 2; align-self: stretch; margin: 0 auto; width: 100%; max-width: 360px !important; max-height: none !important; height: 100%; padding: calc(8vh + var(--safe-t)) 8px 0 !important; gap: 12px; background: transparent !important; box-shadow: none !important; border: 0; border-radius: 0 !important; color: #fff; overflow: visible !important; animation: none !important; }
    .auth-brand { display: flex; flex-direction: column; align-items: center; gap: 6px; margin-bottom: auto; text-shadow: 0 2px 16px rgba(0,0,20,.5); }
    .auth-brand .brand-mark { display: none; }
    .auth-brand h1 { font-family: 'Bodoni Moda', 'Bodoni 72', 'Didot', Georgia, serif; font-style: italic; font-size: 52px; font-weight: 500; letter-spacing: .01em; line-height: 1; color: #fff; }
    .auth-brand p { font-size: 14px; color: rgba(255,255,255,.75); letter-spacing: .3em; }
    .auth-card .seg { background: transparent; padding: 0; gap: 22px; justify-content: center; margin-bottom: 4px !important; }
    .auth-card .seg button { flex: none; padding: 4px 2px; border-radius: 0; color: rgba(255,255,255,.55); font-size: 15px; background: transparent !important; box-shadow: none !important; border-bottom: 2px solid transparent; }
    .auth-card .seg button.active { color: #fff; font-weight: 600; border-bottom-color: #fff; }
    .auth-card .field { background: rgba(255,255,255,.12); border: 1px solid rgba(255,255,255,.22); color: #fff; border-radius: 999px; padding: 13px 20px; -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); }
    .auth-card .field::placeholder { color: rgba(255,255,255,.6); }
    .auth-card .field:focus { border-color: rgba(255,255,255,.7); background: rgba(255,255,255,.18); }
    .auth-card .error-msg { color: #ffb4b8; text-align: center; }
    #auth-submit-btn { border-radius: 999px; background: #fff !important; color: #1b2a52 !important; font-weight: 600; padding: 13px !important; box-shadow: 0 8px 24px rgba(0,0,20,.35); margin-bottom: calc(4vh + var(--safe-b)); }

    .profile-top { display: flex; flex-direction: column; align-items: center; gap: 8px; }
    .avatar-edit { position: relative; cursor: pointer; }
    .avatar-edit .cam { position: absolute; right: -2px; bottom: -2px; width: 28px; height: 28px; border-radius: 50%; background: var(--accent); color: #fff; display: grid; place-items: center; border: 3px solid var(--panel); }
    .avatar-edit .cam svg { width: 13px; height: 13px; }
    .set-group { background: var(--panel2); border-radius: 14px; overflow: hidden; }
    .set-row { display: flex; align-items: center; gap: 10px; padding: 12px 14px; font-size: 14px; }
    .set-row + .set-row { border-top: 1px solid var(--line); }
    .set-row .sr-label { flex: 1; }
    .set-row .sr-val { color: var(--text3); font-size: 13px; }
    .mini-seg { display: flex; background: var(--panel); border-radius: 9px; padding: 2px; }
    .mini-seg button { padding: 4px 10px; border-radius: 7px; font-size: 13px; color: var(--text2); }
    .mini-seg button.active { background: var(--accent); color: #fff; }
    .set-link { width: 100%; text-align: left; }
    .set-link.danger { color: var(--danger); }

    #lightbox { position: fixed; inset: 0; background: rgba(0,0,0,.9); z-index: 400; display: none; align-items: center; justify-content: center; }
    #lightbox.open { display: flex; }
    #lightbox img { max-width: 96vw; max-height: 90dvh; object-fit: contain; }
    #lightbox .lb-actions { position: absolute; top: calc(12px + var(--safe-t)); right: 12px; display: flex; gap: 8px; }
    #lightbox .lb-actions button { width: 40px; height: 40px; border-radius: 50%; background: rgba(255,255,255,.14); color: #fff; display: grid; place-items: center; }
    #file-iframe-modal { position: fixed; inset: 0; background: var(--bg); z-index: 400; display: none; flex-direction: column; }
    #file-iframe-modal.open { display: flex; }
    #iframe-header { display: flex; align-items: center; gap: 8px; padding: calc(10px + var(--safe-t)) 12px 10px; background: var(--panel); border-bottom: 1px solid var(--line); }
    #iframe-filename { flex: 1; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    #file-iframe { flex: 1; border: none; background: #fff; }
    #preview-content { flex: 1; overflow: auto; background: var(--panel2); padding: 12px; border-radius: 12px; font-size: 12px; font-family: var(--mono); white-space: pre-wrap; word-break: break-all; min-height: 100px; max-height: 60dvh; }

    #toast { position: fixed; left: 50%; top: calc(16px + var(--safe-t)); transform: translate(-50%, -20px); background: var(--text); color: var(--panel); padding: 10px 16px; border-radius: 12px; font-size: 14px; z-index: 500; opacity: 0; pointer-events: none; transition: all .2s; max-width: calc(100vw - 32px); box-shadow: var(--shadow-lg); }
    #toast.show { opacity: 1; transform: translate(-50%, 0); }
    #toast.error { background: var(--danger); color: #fff; }

    .spinner { width: 18px; height: 18px; border: 2px solid rgba(255,255,255,.35); border-top-color: #fff; border-radius: 50%; animation: spin .7s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    #loading-screen { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: var(--bg); z-index: 600; }
    #loading-screen .spinner { border-color: var(--line); border-top-color: var(--accent); width: 26px; height: 26px; }

    /* ── mobile ── */
    @media (max-width: 760px) {
      #sidebar { width: 100%; border-right: none; }
      #main { position: fixed; inset: 0; transform: translateX(100%); transition: transform .22s ease; z-index: 50; }
      body.in-chat #main { transform: none; }
      #back-btn { display: grid; }
      .msg-col { max-width: 80%; }
      #messages-area { padding: 12px 10px 6px; }
      .modal-bg { align-items: flex-end; padding: 0; }
      .modal { max-width: none; border-radius: 22px 22px 0 0; padding-bottom: calc(22px + var(--safe-b)); }
      .auth-bg { align-items: stretch !important; padding: 0 20px !important; }
      .auth-bg .modal { border-radius: 22px; }
    }
    @media (min-width: 761px) { body:not(.has-conv) #composer { display: none; } }
  </style>
</head>

<div id="app" style="display:none">
  <aside id="sidebar">
    <div class="side-top">
      <div class="brand"><span class="brand-mark"><svg><use href="#i-frost"/></svg></span>Frostline</div>
      <button class="icon-btn" id="new-chat-btn" title="新建"><svg><use href="#i-plus"/></svg></button>

    <div class="me-row">

  </main>

function escHtml(str) {
  return String(str ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}
function initials(name) { return name ? [...name].slice(0, 2).join('').toUpperCase() : '?'; }
function avatarColor(name) {
  const colors = ['#5b8def', '#34b3a0', '#e8766b', '#9b7be6', '#e0a13a', '#4fa3d9', '#d46fa8', '#6aa84f'];
  let h = 0; for (const ch of (name || '')) h = (h * 31 + ch.codePointAt(0)) >>> 0;
  return colors[h % colors.length];
}
function userById(id) { return allUsers.find(u => u.id === id); }
function userName(id) { const u = userById(id); return u ? u.username : '未知用户'; }
function makeAvatar(name, url, cls = '') {
  const el = document.createElement('div');
  el.className = 'avatar ' + cls;
  if (url) { const img = document.createElement('img'); img.src = url; img.alt = ''; el.appendChild(img); }
  else { el.textContent = initials(name); el.style.background = avatarColor(name); }
  return el;
}
function userAvatar(id, cls = '') { const u = userById(id); return makeAvatar(u ? u.username : '?', u && u.avatar_url, cls); }
function pad(n) { return String(n).padStart(2, '0'); }
function formatTime(ts) { const d = new Date(ts); return pad(d.getHours()) + ':' + pad(d.getMinutes()); }
function dayKey(ts) { const d = new Date(ts); return d.getFullYear() + '-' + d.getMonth() + '-' + d.getDate(); }
function formatDate(ts) {
  const d = new Date(ts), now = new Date();
  const y = new Date(now); y.setDate(now.getDate() - 1);
  if (dayKey(d) === dayKey(now)) return '今天';
  if (dayKey(d) === dayKey(y)) return '昨天';
  if (d.getFullYear() === now.getFullYear()) return `${d.getMonth() + 1}月${d.getDate()}日`;
  return `${d.getFullYear()}年${d.getMonth() + 1}月${d.getDate()}日`;
}
function formatDateTime(ts) {
  const d = new Date(ts), now = new Date();
  const base = d.getFullYear() === now.getFullYear() ? `${d.getMonth() + 1}月${d.getDate()}日` : `${d.getFullYear()}/${d.getMonth() + 1}/${d.getDate()}`;
  return `${base} ${formatTime(ts)}`;
}
function formatListTime(ts) {
  if (!ts) return '';
  const d = new Date(ts), now = new Date();
  if (dayKey(d) === dayKey(now)) return formatTime(ts);
  const f = formatDate(ts);
  return f === '昨天' ? f : `${d.getMonth() + 1}/${d.getDate()}`;
}
function formatSize(b) {
  if (!b && b !== 0) return '';
  if (b < 1024) return b + ' B';
  if (b < 1048576) return (b / 1024).toFixed(1) + ' KB';
  return (b / 1048576).toFixed(1) + ' MB';
}
function openModal(id) { $(id).classList.add('open'); }

});

// ── MARKDOWN（轻量） ──
const PH = String.fromCharCode(0xE000);
function renderMarkdown(src) {
  const blocks = [];
  let s = String(src || '').replace(/```(\w*)\n?([\s\S]*?)```/g, (_, lang, code) => {
    blocks.push('<pre><code>' + escHtml(code.replace(/\n$/, '')) + '</code></pre>');
    return PH + 'B' + (blocks.length - 1) + PH;
  });
  const inl = [];
  s = s.replace(/`([^`\n]+)`/g, (_, c) => { inl.push('<code>' + escHtml(c) + '</code>'); return PH + 'I' + (inl.length - 1) + PH; });
  s = escHtml(s);
  s = s.replace(/\*\*(\S(?:[\s\S]*?\S)?)\*\*/g, '<strong>$1</strong>');
  s = s.replace(/~~([^~\n]+)~~/g, '<del>$1</del>');
  s = s.replace(/(https?:\/\/[^\s<]+[^\s<.,;:!?)）。，；！？])/g, '<a href="$1" target="_blank" rel="noopener">$1</a>');
  s = s.replace(/(^|\s)@([^\s@<]{1,32})/g, (m, pre, name) => allUsers.some(u => escHtml(u.username) === name) ? `${pre}<span class="mention">@${name}</span>` : m);
  s = s.replace(new RegExp(PH + 'I(\\d+)' + PH, 'g'), (_, i) => inl[+i]);
  s = s.replace(new RegExp('\\n?' + PH + 'B(\\d+)' + PH + '\\n?', 'g'), (_, i) => blocks[+i]);
  return s;
}
function plainPreview(content) {
  return String(content || '').replace(/```[\s\S]*?```/g, '[代码]').replace(/\*\*|`|~~/g, '').replace(/\s+/g, ' ').trim();
}

function cropAvatar(file) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onerror = () => reject(new Error('无法读取图片'));
    img.onload = () => {
      const cv = $('crop-canvas'), ctx = cv.getContext('2d'), S = cv.width, R = S * 0.42;
      const base = (2 * R) / Math.min(img.width, img.height);
      let zoom = 1, cx = S / 2, cy = S / 2; // 图片中心在画布上的位置
      const scale = () => base * zoom;
      // 宽松限制：图片至少要和圆框有交集，不强制铺满，空白处填白
      const clamp = () => {
        const w = img.width * scale() / 2, h = img.height * scale() / 2;
        cx = Math.min(S / 2 + R + w - 20, Math.max(S / 2 - R - w + 20, cx));
        cy = Math.min(S / 2 + R + h - 20, Math.max(S / 2 - R - h + 20, cy));
      };
      const draw = () => {
        clamp();
        const w = img.width * scale(), h = img.height * scale();
        ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, S, S);
        ctx.drawImage(img, cx - w / 2, cy - h / 2, w, h);
        ctx.save(); ctx.fillStyle = 'rgba(0,0,0,.55)'; ctx.beginPath(); ctx.rect(0, 0, S, S); ctx.arc(S / 2, S / 2, R, 0, Math.PI * 2, true); ctx.fill('evenodd');
        ctx.strokeStyle = 'rgba(255,255,255,.9)'; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(S / 2, S / 2, R, 0, Math.PI * 2); ctx.stroke(); ctx.restore();
      };
      const setZoom = z => { zoom = Math.min(6, Math.max(0.3, z)); $('crop-zoom').value = zoom; draw(); };
      const stage = $('crop-stage'), zoomEl = $('crop-zoom');
      const k = () => S / stage.clientWidth;
      let last = null; // {x, y, d}
      const read = t => t.length >= 2
        ? { x: (t[0].clientX + t[1].clientX) / 2, y: (t[0].clientY + t[1].clientY) / 2, d: Math.hypot(t[0].clientX - t[1].clientX, t[0].clientY - t[1].clientY) }
        : { x: t[0].clientX, y: t[0].clientY, d: 0 };
      const tstart = e => { e.preventDefault(); last = read(e.touches); };
      const tmove = e => {
        e.preventDefault(); if (!last || !e.touches.length) return;
        const cur = read(e.touches);
        if (cur.d && last.d) {
          // 以双指中点为锚缩放，同时跟着中点平移
          const rect = stage.getBoundingClientRect();
          const ax = (cur.x - rect.left) * k(), ay = (cur.y - rect.top) * k();
          const f = Math.min(6, Math.max(0.3, zoom * cur.d / last.d)) / zoom;
          cx = ax + (cx - ax) * f; cy = ay + (cy - ay) * f; zoom *= f; $('crop-zoom').value = zoom;
        }
        cx += (cur.x - last.x) * k(); cy += (cur.y - last.y) * k();
        last = cur; draw();
      };
      const tend = e => { last = e.touches.length ? read(e.touches) : null; };
      let mdown = null;
      const down = e => { if (e.pointerType !== 'mouse') return; mdown = [e.clientX, e.clientY]; };
      const move = e => { if (!mdown) return; cx += (e.clientX - mdown[0]) * k(); cy += (e.clientY - mdown[1]) * k(); mdown = [e.clientX, e.clientY]; draw(); };
      const up = () => { mdown = null; };
      stage.addEventListener('touchstart', tstart, { passive: false }); stage.addEventListener('touchmove', tmove, { passive: false });
      stage.addEventListener('touchend', tend); stage.addEventListener('touchcancel', tend);
      const wheel = e => { e.preventDefault(); setZoom(zoom * (e.deltaY < 0 ? 1.08 : 1 / 1.08)); };
      const slide = () => setZoom(+zoomEl.value);
      const done = result => {
        stage.removeEventListener('pointerdown', down); removeEventListener('pointermove', move); removeEventListener('pointerup', up);
        stage.removeEventListener('touchstart', tstart); stage.removeEventListener('touchmove', tmove); stage.removeEventListener('touchend', tend); stage.removeEventListener('touchcancel', tend);
        stage.removeEventListener('wheel', wheel); zoomEl.removeEventListener('input', slide);
        $('crop-ok').onclick = $('crop-cancel').onclick = null;
        $('crop-modal').classList.remove('open');
        URL.revokeObjectURL(img.src);
        resolve(result);
      };
      stage.addEventListener('pointerdown', down); addEventListener('pointermove', move);
      addEventListener('pointerup', up);
      stage.addEventListener('wheel', wheel, { passive: false }); zoomEl.addEventListener('input', slide);
      $('crop-cancel').onclick = () => done(null);
      $('crop-ok').onclick = () => {
        const out = document.createElement('canvas'), size = 400, f = size / (2 * R);
        out.width = out.height = size;
        const w = img.width * scale() * f, h = img.height * scale() * f;
        const octx = out.getContext('2d');
        octx.fillStyle = '#fff'; octx.fillRect(0, 0, size, size);
        octx.drawImage(img, (cx - (S / 2 - R)) * f - w / 2, (cy - (S / 2 - R)) * f - h / 2, w, h);
        out.toBlob(b => done(b), 'image/jpeg', 0.9);
      };
      setZoom(1);
      $('crop-modal').classList.add('open');
    };
    img.src = URL.createObjectURL(file);
  });
}
function resizeImage(file, size) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => {
      const s = Math.min(img.width, img.height);
      const c = document.createElement('canvas');
      c.width = c.height = size;
      c.getContext('2d').drawImage(img, (img.width - s) / 2, (img.height - s) / 2, s, s, 0, 0, size, size);
      c.toBlob(b => b ? resolve(b) : reject(new Error('图片处理失败')), 'image/jpeg', 0.88);
      URL.revokeObjectURL(img.src);
    };
    img.onerror = () => reject(new Error('无法读取图片'));
    img.src = URL.createObjectURL(file);
  });
}

let convLoading = false;
async function loadConversations() {
  if (convLoading) return;
  convLoading = true;
  try {
    const { data: memberRows } = await sb.from('conversation_members').select('conversation_id').eq('user_id', currentUser.id);
    if (!memberRows) return;
    if (memberRows.length === 0) { conversations = []; renderConvList(); if (currentConvId) resetChatView(); return; }
    const ids = memberRows.map(r => r.conversation_id);
    const [{ data: convs }, { data: allMembers }, { data: recentMsgs }] = await Promise.all([
      sb.from('conversations').select('*').in('id', ids),
      sb.from('conversation_members').select('conversation_id,user_id').in('conversation_id', ids),
      sb.from('messages').select('conversation_id,content,created_at,sender_id').in('conversation_id', ids).order('created_at', { ascending: false }).limit(500)
    ]);
    if (!convs) return;
    const memberMap = {};
    (allMembers || []).forEach(m => { (memberMap[m.conversation_id] ||= []).push(m.user_id); });
    const readMap = getReadMap();
    const lastMsgMap = {}, unreadMap = {};
    (recentMsgs || []).forEach(m => {
      if (!lastMsgMap[m.conversation_id]) lastMsgMap[m.conversation_id] = m;
      const lastRead = readMap[m.conversation_id];
      if (m.sender_id !== currentUser.id && m.conversation_id !== currentConvId && (!lastRead || m.created_at > lastRead))
        unreadMap[m.conversation_id] = (unreadMap[m.conversation_id] || 0) + 1;
    });
    if (Object.values(memberMap).flat().some(id => !userById(id))) await loadAllUsers();
    conversations = convs.map(c => {
      const lm = lastMsgMap[c.id] || null;
      return { ...c, member_ids: memberMap[c.id] || [], last_msg: lm, unread: unreadMap[c.id] || 0, last_activity: lm ? lm.created_at : c.updated_at };
    });
    conversations.sort((a, b) => (b.last_activity || '').localeCompare(a.last_activity || ''));
    maybeNotify(unreadMap, lastMsgMap);
    renderConvList();
    if (currentConvId && !conversations.some(c => c.id === currentConvId)) resetChatView();
    else refreshHeader();
  } finally { convLoading = false; }
}

// 只有手指/滚轮真的动过才改 pinnedBottom，图片加载撑高内容时不算用户往上翻
let userScrollUntil = 0;
['touchstart', 'touchmove', 'wheel', 'keydown'].forEach(ev => $('messages-area').addEventListener(ev, () => { userScrollUntil = Date.now() + 1200; }, { passive: true }));
$('messages-area').addEventListener('scroll', () => {
  if (Date.now() > userScrollUntil) return;
  const a = $('messages-area');
  pinnedBottom = a.scrollHeight - a.scrollTop - a.clientHeight < 60;
}, { passive: true });
$('messages-area').addEventListener('load', e => { if (e.target.tagName === 'IMG' && pinnedBottom) scrollToBottom(); }, true);
function scrollToBottom() { const a = $('messages-area'); a.scrollTop = a.scrollHeight; }

async function fetchFiles(ids) {
  if (!ids.length) return {};
  const { data } = await sb.from('files').select('*').in('message_id', ids);
  const map = {};
  (data || []).forEach(f => { (map[f.message_id] ||= []).push(f); });
  return map;
}

async function loadMessages(convId, gen) {
  const { data: msgs, error } = await sb.from('messages').select('*').eq('conversation_id', convId).order('created_at', { ascending: true }).limit(2000);
  if (gen !== loadGen || convId !== currentConvId) return;
  if (error) { toast('消息加载失败', true); return; }
  if (!msgs || msgs.length === 0) { showEmptyChat(); return; }
  const fileMap = await fetchFiles(msgs.map(m => m.id));
  if (gen !== loadGen || convId !== currentConvId) return;
  msgs.forEach(m => { m.files = fileMap[m.id] || []; msgCache.set(m.id, m); renderedMsgIds.add(m.id); });
  lastMsgTimestamp = msgs[msgs.length - 1].created_at;
  rerenderCurrentMessages();
  pinnedBottom = true;
  scrollToBottom();
}
function showEmptyChat() {
  const list = $('msg-list');
  if (list && !list.children.length) list.innerHTML = '<div class="empty-state" id="chat-empty" style="height:auto;padding:60px 0">还没有消息，打个招呼吧</div>';
}

let pollBusy = false;
async function pollMessages(convId, gen) {
  if (pollBusy || gen !== loadGen || convId !== currentConvId || document.hidden) return;
  pollBusy = true;
  try {
    let q = sb.from('messages').select('*').eq('conversation_id', convId).order('created_at', { ascending: true });
    if (lastMsgTimestamp) q = q.gte('created_at', lastMsgTimestamp);
    const { data } = await q;
    if (gen !== loadGen || convId !== currentConvId || !data) return;
    await ingestMessages(data.filter(m => !renderedMsgIds.has(m.id)), convId, gen);
  } finally { pollBusy = false; }
}

async function ingestMessages(msgs, convId, gen) {
  if (!msgs.length) return;
  const fileMap = await fetchFiles(msgs.map(m => m.id));
  if (gen !== loadGen || convId !== currentConvId) return;
  for (const m of msgs) {
    if (renderedMsgIds.has(m.id) || m.conversation_id !== currentConvId) continue;
    m.files = fileMap[m.id] || [];
    renderedMsgIds.add(m.id);
    msgCache.set(m.id, m);
    appendMessage(m);
    if (!lastMsgTimestamp || m.created_at > lastMsgTimestamp) lastMsgTimestamp = m.created_at;
    if (m.sender_id !== currentUser.id) typingUsers.delete(m.sender_id);
  }
  refreshHeader();
  if (!document.hidden) markConvRead(convId, lastMsgTimestamp);
}

function rerenderCurrentMessages() {
  const list = $('msg-list');
  if (!list) return;
  const keepBottom = pinnedBottom;
  list.innerHTML = '';
  delete list.dataset.lastDay;
  const arr = [...msgCache.values()].sort((a, b) => a.created_at.localeCompare(b.created_at));
  arr.forEach(m => appendMessage(m, false));
  if (!arr.length) showEmptyChat();
  if (keepBottom) scrollToBottom();
}

function lastRenderedMsg(list) {
  const els = list.querySelectorAll('.msg');
  return els.length ? els[els.length - 1] : null;
}

function appendMessage(msg, animate = true) {
  const list = $('msg-list');
  if (!list) return null;
  const empty = $('chat-empty'); if (empty) empty.remove();
  const conv = conversations.find(c => c.id === currentConvId);
  const isGroup = conv && conv.type === 'group';
  const isSelf = msg.sender_id === currentUser.id;

  // 按时间插入（本地待发消息总在最后）
  const prev = lastRenderedMsg(list);
  const lastDay = list.dataset.lastDay;
  const dk = dayKey(msg.created_at);
  if (lastDay !== dk) {
    const div = document.createElement('div');
    div.className = 'date-divider';
    div.innerHTML = `<span>${formatDate(msg.created_at)}</span>`;
    list.appendChild(div);
    list.dataset.lastDay = dk;
  }
  const cont = prev && prev.dataset.sender === msg.sender_id && list.lastElementChild === prev &&
    (new Date(msg.created_at) - new Date(prev.dataset.ts) < 5 * 60 * 1000);

  const el = document.createElement('div');
  el.className = `msg ${isSelf ? 'self' : 'other'}${cont ? ' cont' : ''}`;
  el.dataset.id = msg.id;
  el.dataset.sender = msg.sender_id;
  el.dataset.ts = msg.created_at;
  if (msg._state) el.classList.add(msg._state);

  if (!isSelf || isGroup) el.appendChild(userAvatar(msg.sender_id, 'sm'));
  else el.appendChild(document.createElement('span'));
  if (isSelf && !isGroup) el.lastChild.style.display = 'none';

  const col = document.createElement('div');
  col.className = 'msg-col';
  if (isGroup && !isSelf && !cont) {
    const nm = document.createElement('div');
    nm.className = 'msg-sender';
    nm.textContent = userName(msg.sender_id);
    col.appendChild(nm);
  }
  const row = document.createElement('div');
  row.className = 'msg-row-wrap';
  const bubble = document.createElement('div');
  bubble.className = 'bubble';

  if (msg.reply_to) {
    const q = document.createElement('div');
    q.className = 'quote';
    const orig = msgCache.get(msg.reply_to);
    q.innerHTML = orig
      ? `<div class="q-name">${escHtml(userName(orig.sender_id))}</div><div class="q-text">${escHtml(plainPreview(orig.content) || '[文件]')}</div>`
      : '<div class="q-text">原消息已撤回</div>';
    q.addEventListener('click', e => { e.stopPropagation(); jumpToMessage(msg.reply_to); });
    bubble.appendChild(q);
  }
  const text = (msg.content || '').trim();
  if (text) {
    const md = document.createElement('div');
    md.className = 'md';
    md.style.whiteSpace = 'pre-wrap';
    md.innerHTML = renderMarkdown(msg.content);
    bubble.appendChild(md);
  }
  const files = msg.files || [];
  files.forEach(f => bubble.appendChild(renderAttachment(f)));
  if (!text && !msg.reply_to && files.length && files.every(f => (f.file_type || '').startsWith('image/'))) bubble.classList.add('media-only');
  row.appendChild(bubble);

  const more = document.createElement('button');
  more.className = 'msg-more';
  more.innerHTML = '<svg><use href="#i-dots"/></svg>';
  more.addEventListener('click', e => { e.stopPropagation(); openMsgMenu(msg, e.clientX, e.clientY); });
  if (!msg._state) row.appendChild(more);
  col.appendChild(row);

  const meta = document.createElement('div');
  meta.className = 'msg-meta';
  if (msg._state === 'pending') meta.innerHTML = '<span class="sending-tag">发送中…</span>';
  else if (msg._state === 'failed') {
    meta.innerHTML = `<span class="fail-tag">${escHtml(msg._error || '发送失败')}，点此重发</span>`;
    meta.querySelector('.fail-tag').addEventListener('click', () => resendFailed(msg));
  } else meta.textContent = formatTime(msg.created_at);
  col.appendChild(meta);
  el.appendChild(col);
  if (cont && prev) { const pm = prev.querySelector('.msg-meta'); if (pm && !prev.classList.contains('failed') && !prev.classList.contains('pending')) pm.style.display = 'none'; }

  if (!msg._state) attachLongPress(el, bubble, msg);
  list.appendChild(el);
  return el;
}

function renderAttachment(f) {
  const type = f.file_type || '';
  const wrap = document.createElement('div');
  wrap.className = 'attach';
  if (type.startsWith('image/')) {
    const img = document.createElement('img');
    img.className = 'img-attach';
    img.src = f.file_url;
    img.alt = f.file_name;
    img.addEventListener('click', e => { e.stopPropagation(); openLightbox(f.file_url, f.file_name); });
    wrap.appendChild(img);
    return wrap;
  }
  if (type.startsWith('video/')) {
    const v = document.createElement('video');
    v.className = 'img-attach'; v.src = f.file_url; v.controls = true; v.preload = 'metadata';
    wrap.appendChild(v);
    return wrap;
  }
  if (type.startsWith('audio/')) {
    const a = document.createElement('audio');
    a.src = f.file_url; a.controls = true; a.style.maxWidth = '100%';
    wrap.appendChild(a);
    return wrap;
  }
  const card = document.createElement('div');
  card.className = 'file-card';
  card.innerHTML = `<div class="f-icon"><svg><use href="#i-file"/></svg></div><div style="min-width:0"><div class="f-name">${escHtml(f.file_name)}</div><div class="f-size">${formatSize(f.file_size)}</div></div>`;
  wrap.appendChild(card);
  const acts = document.createElement('div');
  acts.className = 'file-actions';
  const addBtn = (label, fn) => { const b = document.createElement('button'); b.className = 'chip-btn'; b.textContent = label; b.addEventListener('click', e => { e.stopPropagation(); fn(); }); acts.appendChild(b); };
  if (isTextFile(f.file_name)) addBtn('预览', () => previewTextFile(f.file_url, f.file_name));
  else if (canPreviewOnline(type, f.file_name)) addBtn('预览', () => previewFileOnline(f.file_url, f.file_name));
  addBtn('下载', () => forceDownload(f.file_url, f.file_name));
  wrap.appendChild(acts);
  card.addEventListener('click', () => forceDownload(f.file_url, f.file_name));
  return wrap;
}

function jumpToMessage(id) {
  const el = document.querySelector(`#msg-list .msg[data-id="${id}"]`);
  if (!el) { toast('找不到这条消息'); return; }
  pinnedBottom = false;
  el.scrollIntoView({ block: 'center', behavior: 'smooth' });
  el.classList.remove('flash'); void el.offsetWidth; el.classList.add('flash');
}

// ── LONG PRESS / CONTEXT MENU ──
function attachLongPress(el, bubble, msg) {
  let timer = null, sx = 0, sy = 0;
  bubble.addEventListener('touchstart', e => {
    const t = e.touches[0]; sx = t.clientX; sy = t.clientY;
    timer = setTimeout(() => { timer = null; if (navigator.vibrate) navigator.vibrate(10); openMsgMenu(msg, sx, sy); }, 450);
  }, { passive: true });
  bubble.addEventListener('touchmove', e => { const t = e.touches[0]; if (Math.hypot(t.clientX - sx, t.clientY - sy) > 10) { clearTimeout(timer); timer = null; } }, { passive: true });
  bubble.addEventListener('touchend', () => { clearTimeout(timer); timer = null; });
  bubble.addEventListener('contextmenu', e => {
    if (e.target.closest('a')) return;
    e.preventDefault(); openMsgMenu(msg, e.clientX, e.clientY);
  });
}
function openMsgMenu(msg, x, y) {
  const menu = $('ctx-menu');
  menu.innerHTML = '';
  const add = (icon, label, fn, danger) => {
    const b = document.createElement('button');
    if (danger) b.className = 'danger';
    b.innerHTML = `<svg><use href="#i-${icon}"/></svg>${label}`;
    b.addEventListener('click', () => { closeMenu(); fn(); });
    menu.appendChild(b);
  };
  add('reply', '引用回复', () => setReply(msg));
  if ((msg.content || '').trim()) add('copy', '复制', () => copyText(msg.content));
  if (msg.sender_id === currentUser.id) add('undo', '撤回', () => recallMessage(msg), true);
  showMenu(menu, x, y);
}
function showMenu(menu, x, y) {
  menu.classList.add('open');
  const r = menu.getBoundingClientRect();
  menu.style.left = Math.max(8, Math.min(x, innerWidth - r.width - 8)) + 'px';
  menu.style.top = Math.max(8, Math.min(y, innerHeight - r.height - 8)) + 'px';
}
function closeMenu() { $('ctx-menu').classList.remove('open'); }
document.addEventListener('click', e => { if (!e.target.closest('#ctx-menu')) closeMenu(); });
document.addEventListener('scroll', closeMenu, true);

async function copyText(text) {
  try { await navigator.clipboard.writeText(text); toast('已复制'); }
  catch (e) {
    const ta = document.createElement('textarea');
    ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); toast('已复制'); } catch (err) { toast('复制失败', true); }
    ta.remove();
  }
}

async function recallMessage(msg) {
  if (!await confirmDialog('撤回消息', '确定撤回这条消息吗？', '撤回')) return;
  await sb.from('files').delete().eq('message_id', msg.id);
  const { error } = await sb.from('messages').delete().eq('id', msg.id);
  if (error) { toast('撤回失败', true); return; }
  removeMessageLocal(msg.id);
  loadConversations();
}
function removeMessageLocal(id) {
  if (!msgCache.has(id)) return;
  msgCache.delete(id);
  rerenderCurrentMessages();
}

// ── REPLY ──
function setReply(msg) {
  replyTarget = msg;
  $('reply-bar').querySelector('.rb-text').innerHTML = `<b>${escHtml(userName(msg.sender_id))}</b>　${escHtml(plainPreview(msg.content) || '[文件]')}`;
  $('reply-bar').classList.add('open');
  $('msg-input').focus();
}
function clearReply() { replyTarget = null; $('reply-bar').classList.remove('open'); }
$('reply-cancel').addEventListener('click', clearReply);

// ── SEND ──
function extractMentionIds(content) {
  const ids = [];
  const re = /@([^\s@]{1,32})/g; let m;
  while ((m = re.exec(content)) !== null) {
    const u = allUsers.find(x => x.username === m[1]);
    if (u && !ids.includes(u.id)) ids.push(u.id);
  }
  return ids;
}

async function sendMessage() {
  const input = $('msg-input');
  const content = input.value.trim();
  if (!content && pendingFiles.length === 0) return;
  if (!currentConvId) return;
  const files = pendingFiles.slice();
  const draft = {
    id: 'local-' + Date.now() + Math.random().toString(36).slice(2),
    conversation_id: currentConvId,
    sender_id: currentUser.id,
    content,
    reply_to: replyTarget ? replyTarget.id : null,
    created_at: new Date().toISOString(),
    files: files.map(f => ({ file_name: f.name, file_type: f.type, file_size: f.size, file_url: f.type.startsWith('image/') ? URL.createObjectURL(f) : '' })),
    _raw: files,
    _state: 'pending'
  };
  input.value = ''; autoResize();
  pendingFiles = []; renderFilePreviews();
  clearReply();
  $('mention-popup').classList.remove('open');
  sendTyping(false);
  pinnedBottom = true;
  msgCache.set(draft.id, draft);
  appendMessage(draft);
  scrollToBottom();
  await deliver(draft);
}

async function deliver(draft) {
  const convId = draft.conversation_id;
  try {
    // 先传文件，全部成功后再发消息，避免只发出一半
    const uploaded = [];
    for (const file of draft._raw) {
      if (file.size > MAX_FILE_SIZE) throw new Error(`「${file.name}」超过 50 MB`);
      const ext = (file.name.split('.').pop() || 'bin').replace(/[^\w]/g, '');
      const path = `${currentUser.id}/${Date.now()}_${Math.random().toString(36).slice(2)}.${ext}`;
      const { error } = await sb.storage.from('chat-files').upload(path, file, { contentType: file.type || 'application/octet-stream' });
      if (error) throw new Error(`「${file.name}」上传失败` + (/size|large|413/i.test(error.message) ? '：文件太大' : ''));
      uploaded.push({ file_name: file.name, file_type: file.type, file_url: sb.storage.from('chat-files').getPublicUrl(path).data.publicUrl, file_size: file.size });
    }
    const row = { conversation_id: convId, sender_id: currentUser.id, content: draft.content, mentioned_user_ids: extractMentionIds(draft.content) };
    if (draft.reply_to) row.reply_to = draft.reply_to;
    const { data: msg, error } = await sb.from('messages').insert(row).select().single();
    if (error) throw new Error('发送失败');
    if (uploaded.length) {
      const { error: fe } = await sb.from('files').insert(uploaded.map(f => ({ ...f, message_id: msg.id })));
      if (fe) toast('文件记录保存失败', true);
    }
    msg.files = uploaded;
    msgCache.delete(draft.id);
    draft.files.forEach(f => { if (f.file_url.startsWith('blob:')) URL.revokeObjectURL(f.file_url); });
    if (convId === currentConvId) {
      msgCache.set(msg.id, msg);
      renderedMsgIds.add(msg.id);
      if (!lastMsgTimestamp || msg.created_at > lastMsgTimestamp) lastMsgTimestamp = msg.created_at;
      markConvRead(convId, msg.created_at);
      rerenderCurrentMessages();
    }
    sb.from('conversations').update({ updated_at: new Date().toISOString() }).eq('id', convId).then(() => {});
    loadConversations();
  } catch (err) {
    draft._state = 'failed';
    draft._error = err.message || '发送失败';
    toast(draft._error, true);
    if (convId === currentConvId) rerenderCurrentMessages();
  }
}
async function resendFailed(draft) {
  draft._state = 'pending';
  draft._error = null;
  if (draft._raw.some(f => f.size > MAX_FILE_SIZE)) {
    draft._raw = draft._raw.filter(f => f.size <= MAX_FILE_SIZE);
    draft.files = draft.files.filter(f => f.file_size <= MAX_FILE_SIZE);
    if (!draft.content && !draft._raw.length) { msgCache.delete(draft.id); rerenderCurrentMessages(); toast('文件太大，已移除'); return; }
  }
  rerenderCurrentMessages();
  await deliver(draft);
}

$('send-btn').addEventListener('click', sendMessage);
$('msg-input').addEventListener('keydown', e => {
  const popup = $('mention-popup');
  if (popup.classList.contains('open') && ['ArrowDown', 'ArrowUp', 'Enter', 'Tab', 'Escape'].includes(e.key)) {
    const items = [...popup.querySelectorAll('.pick-item')];
    let i = items.findIndex(x => x.classList.contains('sel'));
    if (e.key === 'Escape') { popup.classList.remove('open'); e.preventDefault(); return; }
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
      e.preventDefault();
      if (i >= 0) items[i].classList.remove('sel');
      i = (i + (e.key === 'ArrowDown' ? 1 : -1) + items.length) % items.length;
      items[i].classList.add('sel');
      return;
    }
    if (i >= 0) { e.preventDefault(); items[i].dispatchEvent(new MouseEvent('mousedown')); return; }
  }
  if (e.key === 'Enter' && !e.shiftKey && !e.isComposing && !('ontouchstart' in window && window.matchMedia('(max-width: 760px)').matches)) {
    e.preventDefault();
    sendMessage();
  }
});
function autoResize() { const i = $('msg-input'); i.style.height = ''; if (!i.value || !i.scrollHeight) return; i.style.height = Math.min(i.scrollHeight, 140) + 'px'; }
$('msg-input').addEventListener('input', () => { autoResize(); updateMentionPopup(); if ($('msg-input').value.trim()) sendTyping(true); });
$('msg-input').addEventListener('click', updateMentionPopup);
$('msg-input').addEventListener('blur', () => setTimeout(() => $('mention-popup').classList.remove('open'), 150));

// ── @MENTION POPUP ──
function updateMentionPopup() {
  const input = $('msg-input');
  const popup = $('mention-popup');
  const conv = conversations.find(c => c.id === currentConvId);
  if (!conv || conv.type !== 'group') { popup.classList.remove('open'); return; }
  const m = input.value.slice(0, input.selectionStart).match(/@([^\s@]*)$/);
  if (!m) { popup.classList.remove('open'); return; }
  const q = m[1].toLowerCase();
  const members = conv.member_ids.filter(id => id !== currentUser.id).map(userById).filter(u => u && u.username.toLowerCase().includes(q));
  if (!members.length) { popup.classList.remove('open'); return; }
  popup.innerHTML = '';
  members.slice(0, 8).forEach((u, idx) => {
    const item = document.createElement('div');
    item.className = 'pick-item' + (idx === 0 ? ' sel' : '');
    item.appendChild(makeAvatar(u.username, u.avatar_url, 'xs'));
    const sp = document.createElement('span'); sp.className = 'pi-name'; sp.textContent = u.username;
    item.appendChild(sp);
    item.addEventListener('mousedown', e => { e.preventDefault(); insertMention(u.username, m[1]); });
    popup.appendChild(item);
  });
  popup.classList.add('open');
}
function insertMention(username, partial) {
  const input = $('msg-input');
  const pos = input.selectionStart;
  const before = input.value.slice(0, pos);
  const nb = before.slice(0, before.length - partial.length - 1) + '@' + username + ' ';
  input.value = nb + input.value.slice(pos);
  input.setSelectionRange(nb.length, nb.length);
  input.focus();
  $('mention-popup').classList.remove('open');
}

// ── FILES ──
$('file-btn').addEventListener('click', () => $('file-input').click());
$('file-input').addEventListener('change', e => { Array.from(e.target.files).forEach(addPendingFile); e.target.value = ''; });
function addPendingFile(file) {
  if (file.size > MAX_FILE_SIZE) { toast(`「${file.name}」有 ${formatSize(file.size)}，超过 50 MB，发不出去`, true); return; }
  if (file.size === 0) { toast(`「${file.name}」是空文件`, true); return; }
  pendingFiles.push(file);
  renderFilePreviews();
}
function renderFilePreviews() {
  const box = $('file-previews');
  box.innerHTML = '';
  pendingFiles.forEach((f, i) => {
    const chip = document.createElement('div');
    chip.className = 'fp-chip';
    chip.innerHTML = `<span class="fp-name">${escHtml(f.name)}</span><span style="color:var(--text3)">${formatSize(f.size)}</span><button><svg style="width:13px;height:13px"><use href="#i-x"/></svg></button>`;
    chip.querySelector('button').addEventListener('click', () => { pendingFiles.splice(i, 1); renderFilePreviews(); });
    box.appendChild(chip);
  });
}
(function setupDragDrop() {
  const main = $('main'), overlay = $('drop-overlay');
  let depth = 0;
  const hasFiles = e => Array.from(e.dataTransfer?.types || []).includes('Files');
  main.addEventListener('dragenter', e => { if (!currentConvId || !hasFiles(e)) return; e.preventDefault(); depth++; overlay.classList.add('show'); });
  main.addEventListener('dragover', e => { if (currentConvId && hasFiles(e)) e.preventDefault(); });
  main.addEventListener('dragleave', () => { depth--; if (depth <= 0) { depth = 0; overlay.classList.remove('show'); } });
  main.addEventListener('drop', e => {
    depth = 0; overlay.classList.remove('show');
    if (!currentConvId || !hasFiles(e)) return;
    e.preventDefault();
    Array.from(e.dataTransfer.files || []).forEach(addPendingFile);
  });
})();
$('msg-input').addEventListener('paste', e => {
  const items = Array.from(e.clipboardData?.items || []);
  let added = false;
  items.forEach(it => { if (it.kind === 'file') { const f = it.getAsFile(); if (f) { addPendingFile(f); added = true; } } });
  if (added) e.preventDefault();
});

// ── REALTIME ──
function subscribeGlobal() {
  sb.channel('frostline-global')
    .on('postgres_changes', { event: '*', schema: 'public', table: 'conversations' }, () => loadConversations())
    .on('postgres_changes', { event: '*', schema: 'public', table: 'conversation_members' }, () => loadConversations())
    .subscribe();
}
function unsubscribeConv() {
  if (msgChannel) { sb.removeChannel(msgChannel); msgChannel = null; }
  if (typingChannel) { sb.removeChannel(typingChannel); typingChannel = null; }
  typingUsers.clear();
}
function subscribeConv(convId) {
  unsubscribeConv();
  msgChannel = sb.channel('msgs-' + convId)
    .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages', filter: `conversation_id=eq.${convId}` }, payload => {
      if (convId !== currentConvId) return;
      const m = payload.new;
      if (renderedMsgIds.has(m.id)) return;
      // 稍等文件记录写入
      setTimeout(() => ingestMessages([m], convId, loadGen), m.content ? 0 : 900);
    })
    .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'messages', filter: `conversation_id=eq.${convId}` }, payload => {
      if (convId !== currentConvId) return;
      const old = msgCache.get(payload.new.id);
      if (!old) return;
      msgCache.set(old.id, { ...old, ...payload.new, files: old.files });
      rerenderCurrentMessages();
    })
    .on('postgres_changes', { event: 'DELETE', schema: 'public', table: 'messages' }, payload => {
      if (convId !== currentConvId) return;
      const id = payload.old && payload.old.id;
      if (id) { removeMessageLocal(id); loadConversations(); }
    })
    .subscribe();
  typingChannel = sb.channel('typing-' + convId, { config: { broadcast: { self: false } } })
    .on('broadcast', { event: 'typing' }, ({ payload }) => {
      if (convId !== currentConvId || !payload || payload.user_id === currentUser.id) return;
      clearTimeout(typingUsers.get(payload.user_id));
      if (payload.typing) typingUsers.set(payload.user_id, setTimeout(() => { typingUsers.delete(payload.user_id); refreshHeader(); }, 5000));
      else typingUsers.delete(payload.user_id);
      refreshHeader();
    })
    .subscribe();
}
function sendTyping(on) {
  if (!typingChannel) return;
  const now = Date.now();
  if (on && now - lastTypingSent < 2500) return;
  lastTypingSent = on ? now : 0;
  typingChannel.send({ type: 'broadcast', event: 'typing', payload: { user_id: currentUser.id, typing: on } });
}

function highlight(text, q) {
  const lower = text.toLowerCase(), ql = q.toLowerCase();
  let i = lower.indexOf(ql);
  if (i < 0) return escHtml(text);
  // 关键词靠后时截掉前面一段，保证能看到命中
  let start = 0;
  if (i > 40) { start = i - 20; text = '…' + text.slice(start); i = i - start + 1; }
  let out = '', pos = 0;
  const lt = text.toLowerCase();
  while ((i = lt.indexOf(ql, pos)) >= 0) {
    out += escHtml(text.slice(pos, i)) + '<mark>' + escHtml(text.slice(i, i + q.length)) + '</mark>';
    pos = i + q.length;
  }
  return out + escHtml(text.slice(pos));
}
async function runSearch(raw) {

function isTextFile(filename) {
  const ext = (filename || '').split('.').pop().toLowerCase();
  return ['txt','py','js','ts','html','css','json','md','xml','yaml','yml','ini','cfg','conf','sh','bash','zsh','java','c','cpp','h','hpp','cs','go','rs','rb','php','pl','lua','r','sql','log','toml','vue','jsx','tsx','scss','less','sass','styl','bat','cmd','ps1'].includes(ext);
}
function canPreviewOnline(type, name) {
  const ext = (name || '').split('.').pop().toLowerCase();
  return ['doc','docx','xls','xlsx','ppt','pptx','pdf','csv'].includes(ext) || /word|sheet|excel|presentation|pdf/.test(type || '');
}
function triggerDownload(blob, filename) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
async function fetchTextUtf8(url) {
  const resp = await fetch(url, { mode: 'cors' });
  if (!resp.ok) throw new Error('fetch failed: ' + resp.status);
  return new TextDecoder('utf-8', { fatal: false }).decode(await resp.arrayBuffer());
}
async function forceDownload(url, filename) {
  try {
    const resp = await fetch(url, { mode: 'cors' });
    if (!resp.ok) throw new Error('fetch failed');
    if (isTextFile(filename)) {
      const text = new TextDecoder('utf-8', { fatal: false }).decode(await resp.arrayBuffer());
      triggerDownload(new Blob(['﻿' + text], { type: 'text/plain;charset=utf-8' }), filename);
    } else triggerDownload(await resp.blob(), filename);
  } catch (e) { window.open(url, '_blank'); }
}
function previewFileOnline(url, filename) {
  const ext = (filename || '').split('.').pop().toLowerCase();
  $('iframe-filename').textContent = filename;
  $('file-iframe').src = ext === 'pdf' ? url : `https://view.officeapps.live.com/op/view.aspx?src=${encodeURIComponent(url)}`;
  $('iframe-download-btn').onclick = () => forceDownload(url, filename);
  $('file-iframe-modal').classList.add('open');
}
function closeFilePreview() { $('file-iframe-modal').classList.remove('open'); $('file-iframe').src = 'about:blank'; }
async function previewTextFile(url, filename) {
  try {
    $('preview-filename').textContent = filename;

    $('preview-download-btn').onclick = () => forceDownload(url, filename);

}

    });
    const sub = swReg.pushManager && await swReg.pushManager.getSubscription();
    if (sub) { pushActive = true; await saveSubscription(sub); syncPresence(); }
    else if ('Notification' in window && Notification.permission === 'granted') await subscribePush(true);
  } catch (e) { console.warn('SW register failed', e); }
}
// 在 app 里时告诉服务器别推送：可见时每 20 秒续一次 45 秒的租约，切走就清掉
let presenceTimer = null;
async function reportPresence(active) {
  try {
    if (!currentUser || !swReg || !swReg.pushManager) return;
    const sub = await swReg.pushManager.getSubscription();
    if (!sub) return;
    await sb.from('push_subscriptions').update({ active_until: active ? new Date(Date.now() + 45000).toISOString() : null }).eq('endpoint', sub.endpoint);
  } catch (e) {}
}
function syncPresence() {
  clearInterval(presenceTimer);
  if (document.visibilityState === 'visible') {
    reportPresence(true);
    presenceTimer = setInterval(() => reportPresence(true), 20000);
  } else reportPresence(false);
}
document.addEventListener('visibilitychange', syncPresence);
addEventListener('pagehide', () => reportPresence(false));
function urlB64ToUint8(b64) {
  const p = '='.repeat((4 - b64.length % 4) % 4);
  const raw = atob((b64 + p).replace(/-/g, '+').replace(/_/g, '/'));
  return Uint8Array.from([...raw].map(c => c.charCodeAt(0)));
}
async function saveSubscription(sub) {
  const j = sub.toJSON();
  await sb.from('push_subscriptions').upsert({ user_id: currentUser.id, endpoint: j.endpoint, p256dh: j.keys.p256dh, auth: j.keys.auth }, { onConflict: 'endpoint' });
}
async function subscribePush(silent) {
  const standalone = matchMedia('(display-mode: standalone)').matches || navigator.standalone;
  const ios = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  if (!('serviceWorker' in navigator) || !('PushManager' in window)) {
    if (!silent) toast(ios && !standalone ? '先点分享 → 添加到主屏幕，再从主屏幕打开 Frostline 开启通知' : '这个浏览器不支持推送通知', true);
    return false;
  }
  try {
    const perm = await Notification.requestPermission();
    if (perm !== 'granted') { if (!silent) toast('通知权限被拒绝了，可以在系统设置里打开', true); return false; }
    swReg = swReg || await navigator.serviceWorker.register('/sw.js');
    await navigator.serviceWorker.ready;
    let sub = await swReg.pushManager.getSubscription();
    if (!sub) sub = await swReg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: urlB64ToUint8(VAPID_PUBLIC) });
    await saveSubscription(sub);
    pushActive = true;
    syncPresence();
    if (!silent) toast('通知已开启');
    return true;
  } catch (e) {
    console.error(e);
    if (!silent) toast('开启通知失败：' + (e.message || e), true);
    return false;
  } finally { updatePushUI(); }
}
async function unsubscribePush() {
  if (!swReg || !swReg.pushManager) return;
  const sub = await swReg.pushManager.getSubscription();
  if (!sub) return;
  await sb.from('push_subscriptions').delete().eq('endpoint', sub.endpoint);
  await sub.unsubscribe();
  pushActive = false;
}
function updatePushUI() {
  const st = $('push-status'), btn = $('push-btn');
  if (!st) return;
  if (pushActive) { st.textContent = '已开启'; btn.textContent = '关闭'; btn.className = 'btn btn-ghost'; }
  else { st.textContent = ''; btn.textContent = '开启'; btn.className = 'btn btn-primary'; }
  btn.style.padding = '6px 12px';
}
$('push-btn').addEventListener('click', async () => {
  if (pushActive) { await unsubscribePush().catch(() => {}); updatePushUI(); toast('通知已关闭'); }
  else subscribePush(false);
});

init();
</script>
